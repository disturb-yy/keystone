<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Keystone Dashboard 高保真视觉原型" />
  <title>Keystone Dashboard Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #0b1020;
      --surface: #111a2e;
      --surface-subtle: #17233d;
      --surface-raised: #1b2945;
      --text: #f2f6fc;
      --text-secondary: #aab9d0;
      --muted: #73829a;
      --line: #2a3854;
      --line-subtle: #1f2c45;
      --brand: #3b82f6;
      --brand-bright: #6ea8fe;
      --brand-wash: #152c53;
      --success: #7ddaa7;
      --success-wash: #123523;
      --warning: #f4b75e;
      --warning-wash: #3a2610;
      --danger: #ff9aa2;
      --danger-wash: #3b1c24;
      --radius: 12px;
      --shadow: 0 20px 55px rgb(0 0 0 / 28%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--text); background: var(--canvas); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--brand-bright); outline-offset: 2px; }

    .app { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line-subtle); background: #0d1425; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 28px; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid #548cf4; border-radius: 10px; color: white; background: linear-gradient(145deg, #4f8dfb, #245fc8); box-shadow: 0 8px 22px rgb(59 130 246 / 28%); font: 700 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .brand-copy strong { display: block; font-size: 15px; letter-spacing: .02em; }
    .brand-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .nav-label { margin: 0 10px 8px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .nav { display: grid; gap: 4px; }
    .nav button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px; border: 1px solid transparent; border-radius: 9px; color: var(--text-secondary); background: transparent; text-align: left; transition: background 140ms ease, color 140ms ease, border-color 140ms ease; }
    .nav button:hover { color: var(--text); background: var(--surface-subtle); }
    .nav button.active { border-color: #294f93; color: white; background: var(--brand-wash); }
    .nav-glyph { display: grid; width: 20px; height: 20px; place-items: center; color: currentColor; }
    .nav-glyph svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .nav-count { margin-left: auto; min-width: 22px; padding: 2px 6px; border-radius: 999px; color: var(--warning); background: var(--warning-wash); font-size: 11px; font-variant-numeric: tabular-nums; text-align: center; }
    .sidebar-footer { margin-top: auto; padding: 15px 10px 4px; border-top: 1px solid var(--line-subtle); color: var(--muted); font-size: 11px; line-height: 1.55; }
    .sidebar-footer code { color: var(--text-secondary); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

    .main { min-width: 0; }
    .topbar { height: 66px; padding: 0 34px; border-bottom: 1px solid var(--line-subtle); background: rgb(11 16 32 / 84%); display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(18px); }
    .crumb { color: var(--muted); font-size: 12px; }
    .crumb strong { color: var(--text-secondary); font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .connection { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--text-secondary); background: var(--surface); font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px rgb(125 218 167 / 10%); }
    .scenario { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--text-secondary); background: var(--surface); font-size: 12px; }
    .content { width: min(100%, 1480px); margin: 0 auto; padding: 35px 36px 60px; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
    .eyebrow { margin: 0 0 8px; color: var(--brand-bright); font: 700 10px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--text); font-size: clamp(25px, 3vw, 34px); letter-spacing: -.035em; line-height: 1.1; }
    .lede { max-width: 700px; margin: 10px 0 0; color: var(--text-secondary); font-size: 14px; line-height: 1.65; }
    .button-row { display: flex; align-items: center; gap: 9px; }
    .button { min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--text-secondary); background: var(--surface); font-size: 13px; font-weight: 650; }
    .button:hover { border-color: #4264a0; color: white; background: var(--surface-raised); }
    .button.primary { border-color: #4f86ed; color: #fff; background: var(--brand); box-shadow: 0 8px 18px rgb(59 130 246 / 18%); }
    .button.primary:hover { background: #4a8afa; }
    .button.danger { border-color: #77404b; color: var(--danger); background: transparent; }
    .button.ghost { border-color: transparent; background: transparent; }

    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
    .metric { position: relative; overflow: hidden; padding: 17px 18px; border: 1px solid var(--line-subtle); border-radius: var(--radius); background: var(--surface); }
    .metric::after { position: absolute; top: 0; left: 18px; width: 32px; height: 2px; content: ""; background: var(--brand); }
    .metric.warning::after { background: var(--warning); }
    .metric.success::after { background: var(--success); }
    .metric-label { color: var(--muted); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
    .metric-value { display: block; margin-top: 8px; color: var(--text); font: 650 25px/1 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: -.05em; }
    .metric-detail { display: block; margin-top: 8px; color: var(--text-secondary); font-size: 12px; }

    .panel { overflow: hidden; border: 1px solid var(--line-subtle); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .panel + .panel { margin-top: 16px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 17px 18px; border-bottom: 1px solid var(--line-subtle); }
    .panel-title { margin: 0; color: var(--text); font-size: 14px; letter-spacing: -.01em; }
    .panel-meta { color: var(--muted); font-size: 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 10px 17px; color: var(--muted); background: var(--surface-subtle); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-align: left; text-transform: uppercase; white-space: nowrap; }
    td { padding: 15px 17px; border-top: 1px solid var(--line-subtle); color: var(--text-secondary); vertical-align: middle; }
    tbody tr { transition: background 130ms ease; }
    tbody tr:hover { background: #15213a; }
    tbody tr[data-open] { cursor: pointer; }
    .main-cell { color: var(--text); font-weight: 650; }
    .path { display: block; max-width: 360px; overflow: hidden; color: var(--text-secondary); font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .subtext { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 400; }
    .mini-link { padding: 0; border: 0; color: var(--brand-bright); background: transparent; font-size: 12px; font-weight: 650; }
    .tag { display: inline-flex; align-items: center; min-height: 23px; padding: 0 8px; border: 1px solid transparent; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .tag.primary { border-color: #294f93; color: var(--brand-bright); background: var(--brand-wash); }
    .tag.success { border-color: #1e6240; color: var(--success); background: var(--success-wash); }
    .tag.warning { border-color: #765020; color: var(--warning); background: var(--warning-wash); }
    .tag.danger { border-color: #743641; color: var(--danger); background: var(--danger-wash); }
    .tag.default { border-color: var(--line); color: var(--text-secondary); background: var(--surface-subtle); }

    .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 312px; gap: 16px; }
    .main-stack { display: grid; gap: 16px; }
    .rail { align-self: start; position: sticky; top: 84px; display: grid; gap: 12px; }
    .rail-section { padding: 16px 17px; border: 1px solid var(--line-subtle); border-radius: var(--radius); background: var(--surface); }
    .rail-label { display: block; margin-bottom: 10px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .rail-value { color: var(--text); font-size: 14px; font-weight: 650; }
    .rail-value code { color: var(--text-secondary); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .rail-divider { height: 1px; margin: 14px 0; background: var(--line-subtle); }
    .stack-buttons { display: grid; gap: 8px; }
    .lifecycle { display: grid; grid-template-columns: repeat(8, minmax(64px, 1fr)); gap: 0; padding: 21px 18px 16px; }
    .stage { position: relative; min-width: 0; padding-right: 7px; color: var(--muted); font-size: 10px; }
    .stage::before { display: block; width: 9px; height: 9px; margin-bottom: 9px; border: 2px solid var(--line); border-radius: 50%; content: ""; background: var(--surface); }
    .stage::after { position: absolute; top: 4px; left: 11px; width: calc(100% - 11px); height: 1px; content: ""; background: var(--line); }
    .stage:last-child::after { display: none; }
    .stage.done::before { border-color: var(--success); background: var(--success); }
    .stage.done::after { background: var(--success); }
    .stage.active { color: var(--text); font-weight: 700; }
    .stage.active::before { border-color: var(--brand-bright); box-shadow: 0 0 0 5px rgb(110 168 254 / 13%); background: var(--brand); }
    .next-step { display: flex; align-items: start; gap: 12px; padding: 15px 18px; border-top: 1px solid var(--line-subtle); color: var(--text-secondary); font-size: 13px; line-height: 1.55; }
    .next-marker { flex: 0 0 auto; width: 20px; height: 20px; border: 1px solid #294f93; border-radius: 5px; color: var(--brand-bright); background: var(--brand-wash); text-align: center; line-height: 18px; }
    .trace { display: grid; gap: 0; padding: 2px 18px 12px; }
    .trace-row { display: grid; grid-template-columns: 86px 15px minmax(0, 1fr); gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line-subtle); }
    .trace-row:last-child { border-bottom: 0; }
    .trace-time { color: var(--muted); font: 10px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .trace-dot { width: 8px; height: 8px; margin-top: 4px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px var(--brand-wash); }
    .trace-copy strong { display: block; color: var(--text); font-size: 12px; }
    .trace-copy span { display: block; margin-top: 4px; color: var(--text-secondary); font-size: 12px; line-height: 1.45; }

    .form-shell { display: grid; grid-template-columns: minmax(0, 1fr) 298px; gap: 16px; align-items: start; }
    .form-panel { padding: 25px; }
    .field { display: grid; gap: 8px; margin-bottom: 22px; }
    .field label { color: var(--text); font-size: 13px; font-weight: 700; }
    .field label small { margin-left: 6px; color: var(--danger); font-size: 11px; }
    .field-help { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .input, .select, .textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: #0d1628; transition: border-color 130ms ease, box-shadow 130ms ease; }
    .input, .select { min-height: 42px; padding: 0 12px; }
    .textarea { min-height: 176px; padding: 12px; resize: vertical; line-height: 1.65; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgb(59 130 246 / 14%); outline: none; }
    .advanced { margin: 2px 0 25px; border-top: 1px solid var(--line-subtle); border-bottom: 1px solid var(--line-subtle); }
    .advanced summary { padding: 14px 0; color: var(--text-secondary); font-size: 13px; font-weight: 650; cursor: pointer; }
    .advanced .field { padding-bottom: 16px; margin-bottom: 0; }
    .form-actions { display: flex; justify-content: space-between; gap: 12px; padding-top: 3px; }
    .form-side { padding: 20px; }
    .form-side h2 { margin: 0; color: var(--text); font-size: 14px; }
    .form-side p, .form-side li { color: var(--text-secondary); font-size: 12px; line-height: 1.65; }
    .form-side ul { padding-left: 19px; }
    .form-side code { padding: 3px 5px; border-radius: 4px; color: var(--brand-bright); background: var(--brand-wash); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .notice { display: flex; gap: 10px; margin: 0 0 20px; padding: 12px 13px; border: 1px solid #294f93; border-radius: 8px; color: var(--text-secondary); background: var(--brand-wash); font-size: 12px; line-height: 1.55; }
    .notice.warning { border-color: #765020; background: var(--warning-wash); }
    .notice strong { color: var(--text); }
    .empty { display: grid; min-height: 290px; place-items: center; padding: 35px; text-align: center; }
    .empty-card { max-width: 410px; }
    .empty-symbol { display: grid; width: 46px; height: 46px; margin: 0 auto 15px; place-items: center; border: 1px solid var(--line); border-radius: 14px; color: var(--brand-bright); background: var(--surface-subtle); font: 700 16px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .empty h2 { margin: 0; color: var(--text); font-size: 17px; }
    .empty p { margin: 9px 0 18px; color: var(--text-secondary); font-size: 13px; line-height: 1.65; }
    .copy-command { display: flex; align-items: center; gap: 9px; padding: 7px 8px 7px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--brand-bright); background: #0d1628; text-align: left; }
    .copy-command code { overflow: hidden; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .copy-command .button { min-height: 29px; margin-left: auto; padding: 0 9px; font-size: 11px; }

    .skeleton { overflow: hidden; position: relative; border-radius: 5px; background: var(--surface-subtle); }
    .skeleton::after { position: absolute; inset: 0; content: ""; background: linear-gradient(90deg, transparent, rgb(255 255 255 / 5%), transparent); animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { transform: translateX(100%); } }
    .skeleton-line { height: 13px; margin: 10px 0; }
    .skeleton-line.short { width: 34%; }
    .skeleton-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 20px; padding: 18px; border-top: 1px solid var(--line-subtle); }
    .skeleton-row .skeleton { height: 13px; }
    .error { padding: 28px; border: 1px solid #743641; border-radius: var(--radius); color: var(--text-secondary); background: var(--danger-wash); }
    .error strong { display: block; color: var(--danger); font-size: 14px; }
    .error p { margin: 7px 0 16px; font-size: 13px; line-height: 1.6; }

    .drawer-backdrop { position: fixed; inset: 0; z-index: 10; display: none; background: rgb(0 0 0 / 52%); }
    .drawer-backdrop.visible { display: block; }
    .drawer { position: absolute; top: 0; right: 0; width: min(430px, 94vw); height: 100%; padding: 23px; border-left: 1px solid var(--line); background: #10192c; box-shadow: -18px 0 60px rgb(0 0 0 / 35%); }
    .drawer-head { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line-subtle); padding-bottom: 18px; }
    .drawer h2 { margin: 0; font-size: 18px; }
    .icon-button { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid var(--line); border-radius: 7px; color: var(--text-secondary); background: var(--surface); font-size: 16px; }
    .drawer-section { padding: 20px 0; border-bottom: 1px solid var(--line-subtle); }
    .drawer-section span { display: block; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .drawer-section p { margin: 9px 0 0; color: var(--text-secondary); font-size: 13px; line-height: 1.65; }
    .drawer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 22px; }

    @media (max-width: 1080px) {
      .app { grid-template-columns: 72px minmax(0, 1fr); }
      .sidebar { padding: 20px 10px; }
      .brand { justify-content: center; padding: 0 0 27px; }
      .brand-copy, .nav-label, .nav button span:not(.nav-glyph):not(.nav-count), .sidebar-footer { display: none; }
      .nav button { justify-content: center; padding: 12px 8px; }
      .nav-count { position: absolute; margin: -20px 0 0 25px; }
      .detail-grid, .form-shell { grid-template-columns: 1fr; }
      .rail { position: static; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .content { padding: 29px 26px 52px; }
    }
    @media (max-width: 720px) {
      .app { display: block; }
      .sidebar { position: static; width: 100%; height: auto; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line-subtle); flex-direction: row; align-items: center; gap: 10px; }
      .brand { padding: 0; }
      .nav { display: flex; gap: 3px; margin-left: auto; }
      .nav button { width: 40px; height: 38px; padding: 8px; }
      .nav-count { margin: -20px 0 0 24px; }
      .topbar { height: 54px; padding: 0 17px; }
      .crumb { display: none; }
      .connection { padding: 6px 8px; font-size: 11px; }
      .scenario { max-width: 120px; }
      .content { padding: 25px 16px 42px; }
      .page-heading { align-items: start; flex-direction: column; gap: 14px; }
      .page-heading .button-row { width: 100%; }
      .page-heading .button { flex: 1; }
      .metric-grid { grid-template-columns: 1fr 1fr; }
      .metric { padding: 15px; }
      .metric-value { font-size: 22px; }
      .rail { grid-template-columns: 1fr; }
      .lifecycle { grid-template-columns: repeat(4, 1fr); gap: 16px 0; }
      .stage:nth-child(4)::after { display: none; }
      .stage:nth-child(n+5)::before { margin-top: 3px; }
      .form-panel { padding: 19px; }
      .form-actions { flex-direction: column-reverse; }
      .form-actions .button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><div class="brand-mark">K</div><div class="brand-copy"><strong>Keystone</strong><span>Control Plane</span></div></div>
      <p class="nav-label">Workspace</p>
      <nav class="nav">
        <button class="active" data-route="projects"><span class="nav-glyph"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 14h5"/></svg></span><span>Projects</span></button>
        <button data-route="create"><span class="nav-glyph"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span>Create Change</span></button>
        <button data-route="human"><span class="nav-glyph"><svg viewBox="0 0 24 24"><path d="M12 3 3.9 7.5v9L12 21l8.1-4.5v-9L12 3Z"/><path d="m9 12 2 2 4-4"/></svg></span><span>Needs Human</span><span class="nav-count">2</span></button>
      </nav>
      <div class="sidebar-footer">Local-first daemon<br /><code>127.0.0.1 · ready</code></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">Keystone / <strong id="crumb">Projects</strong></div><div class="top-actions"><label class="connection"><span class="dot"></span>Daemon ready</label><select id="scenario" class="scenario" aria-label="原型状态"><option value="default">Default state</option><option value="loading">Loading state</option><option value="empty">Empty state</option><option value="error">Error state</option></select></div></header>
      <div id="view" class="content"></div>
    </main>
  </div>
  <div id="drawer" class="drawer-backdrop" aria-hidden="true"><aside class="drawer" aria-labelledby="drawer-title"><div class="drawer-head"><div><p class="eyebrow">Human decision</p><h2 id="drawer-title">Review required</h2></div><button class="icon-button" data-close-drawer aria-label="关闭">×</button></div><div class="drawer-section"><span>Change</span><p><code>chg_01HX7N8VBF</code></p></div><div class="drawer-section"><span>Reason</span><p>FinalVerify 的验收条件尚未形成权威通过结论。请核查 Verification Evidence 后选择恢复或取消。</p></div><div class="drawer-section"><span>Evidence references</span><p><code>arf_019e...a1</code><br /><code>arf_019e...b2</code></p></div><label class="field"><span>决定原因（可选）</span><textarea class="textarea" rows="4" placeholder="说明本次人工决定原因"></textarea></label><div class="drawer-actions"><button class="button primary" data-close-drawer>Retry</button><button class="button danger" data-close-drawer>Cancel</button></div></aside></div>
  <script>
    const icons = { refresh: '↻', arrow: '→' };
    const state = { route: 'projects', scenario: 'default', project: 'proj_01HX7M4E', change: 'chg_01HX7N8VBF' };
    const projectOptions = [
      ['proj_01HX7M4E', '/workspaces/keystone'],
      ['proj_01HX7P5D', '/workspaces/ledger-api'],
      ['proj_01HX7Q9A', '/workspaces/agent-tools']
    ];
    const appView = document.querySelector('#view');
    const crumb = document.querySelector('#crumb');

    function escapeHTML(value) { return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]); }
    function tag(value, kind) { return `<span class="tag ${kind}">${value}</span>`; }
    function heading(eyebrow, title, copy, actions = '') { return `<section class="page-heading"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="lede">${copy}</p></div>${actions}</section>`; }
    function controls() { return `<div class="button-row"><button class="button" data-refresh>${icons.refresh} Refresh</button></div>`; }
    function skeleton() { return `<div class="panel"><div class="panel-header"><div class="skeleton skeleton-line short"></div></div>${Array.from({ length: 5 }, () => `<div class="skeleton-row"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`).join('')}</div>`; }
    function empty(title, copy, command = '') { return `<div class="panel empty"><div class="empty-card"><div class="empty-symbol">K</div><h2>${title}</h2><p>${copy}</p>${command ? `<button class="copy-command" data-copy="${command}"><code>${command}</code><span class="button">Copy</span></button>` : ''}</div></div>`; }
    function error(title, copy) { return `<div class="error"><strong>${title}</strong><p>${copy}</p><button class="button" data-refresh>Retry query</button></div>`; }
    function metrics() { return `<section class="metric-grid"><div class="metric"><span class="metric-label">Registered projects</span><strong class="metric-value">08</strong><span class="metric-detail">3 active this week</span></div><div class="metric success"><span class="metric-label">Active changes</span><strong class="metric-value">14</strong><span class="metric-detail">11 progressing normally</span></div><div class="metric warning"><span class="metric-label">Needs human</span><strong class="metric-value">02</strong><span class="metric-detail">Review required today</span></div><div class="metric"><span class="metric-label">Workers</span><strong class="metric-value">03</strong><span class="metric-detail">All heartbeats healthy</span></div></section>`; }

    function projects() {
      if (state.scenario === 'loading') return heading('Inventory', 'Projects', '正在从本机 Daemon 读取已注册仓库。', controls()) + skeleton();
      if (state.scenario === 'empty') return heading('Inventory', 'Projects', '浏览由本机 Daemon 注册的 Project。', controls()) + empty('尚未注册 Project', '先在目标 Git 仓库运行 CLI 注册命令，Dashboard 会在收到刷新提示后显示它。', 'keystone init');
      if (state.scenario === 'error') return heading('Inventory', 'Projects', '浏览由本机 Daemon 注册的 Project。', controls()) + error('无法读取 Project inventory', 'Daemon 当前没有返回可用查询结果。最近一次成功快照不会被伪装为实时数据。');
      return heading('Inventory', 'Projects', '追踪由本机 Daemon 注册的仓库与 Change 工作量。', `<div class="button-row"><button class="button" data-refresh>${icons.refresh} Refresh</button><button class="button primary" data-route="create">Create Change</button></div>`) + metrics() + `<section class="panel"><div class="panel-header"><h2 class="panel-title">Project inventory</h2><span class="panel-meta">08 projects · updated just now</span></div><div class="table-wrap"><table><thead><tr><th>Project</th><th>Changes</th><th>Active</th><th>Last update</th><th></th></tr></thead><tbody><tr data-open="project"><td><span class="main-cell">keystone</span><span class="path">/workspaces/keystone</span></td><td>24</td><td>${tag('06 active', 'primary')}</td><td>2 min ago</td><td><button class="mini-link" data-open="project">Open ${icons.arrow}</button></td></tr><tr data-open="project"><td><span class="main-cell">ledger-api</span><span class="path">/workspaces/ledger-api</span></td><td>11</td><td>${tag('02 active', 'success')}</td><td>18 min ago</td><td><button class="mini-link" data-open="project">Open ${icons.arrow}</button></td></tr><tr data-open="project"><td><span class="main-cell">agent-tools</span><span class="path">/workspaces/agent-tools</span></td><td>08</td><td>${tag('01 paused', 'default')}</td><td>Yesterday</td><td><button class="mini-link" data-open="project">Open ${icons.arrow}</button></td></tr></tbody></table></div></section>`;
    }

    function project() {
      if (state.scenario !== 'default') return heading('Project detail', 'keystone', 'Project identity 与 Change 摘要均由 Daemon Query 提供。', controls()) + (state.scenario === 'loading' ? skeleton() : state.scenario === 'error' ? error('无法读取 Project', '请恢复 Daemon 后重新读取。') : empty('这个 Project 尚无 Change', '创建一条 Change 后，它会在此列表出现。'));
      return heading('Project detail', 'keystone', '已注册 Project 的 Change 队列与当前工作量。', `<div class="button-row"><button class="button" data-route="projects">Back</button><button class="button primary" data-route="create">Create Change</button></div>`) + `<section class="metric-grid"><div class="metric"><span class="metric-label">Repository root</span><strong class="metric-value" style="font-size:16px">/workspaces/keystone</strong><span class="metric-detail">proj_01HX7M4E</span></div><div class="metric success"><span class="metric-label">Active changes</span><strong class="metric-value">06</strong><span class="metric-detail">Latest update 2 min ago</span></div><div class="metric"><span class="metric-label">Total changes</span><strong class="metric-value">24</strong><span class="metric-detail">Since 2026-08-13</span></div><div class="metric warning"><span class="metric-label">Human review</span><strong class="metric-value">01</strong><span class="metric-detail">Open the queue to review</span></div></section>` + `<section class="panel"><div class="panel-header"><h2 class="panel-title">Changes</h2><span class="panel-meta">Server order · 06 active</span></div><div class="table-wrap"><table><thead><tr><th>Change</th><th>Stage</th><th>Status</th><th>Version</th><th>Updated</th><th></th></tr></thead><tbody><tr data-open="change"><td><span class="main-cell">Add Create Change Dashboard flow</span><span class="subtext">chg_01HX7N8VBF</span></td><td>Execute</td><td>${tag('active', 'primary')}</td><td>v12</td><td>2 min ago</td><td><button class="mini-link" data-open="change">Inspect ${icons.arrow}</button></td></tr><tr data-open="change"><td><span class="main-cell">Capture verification evidence</span><span class="subtext">chg_01HX6V4ADK</span></td><td>FinalVerify</td><td>${tag('human_required', 'warning')}</td><td>v07</td><td>28 min ago</td><td><button class="mini-link" data-open="change">Inspect ${icons.arrow}</button></td></tr><tr data-open="change"><td><span class="main-cell">Normalize CLI errors</span><span class="subtext">chg_01HX5V3NQ</span></td><td>Integrate</td><td>${tag('integrate_ready', 'success')}</td><td>v18</td><td>Yesterday</td><td><button class="mini-link" data-open="change">Inspect ${icons.arrow}</button></td></tr></tbody></table></div></section>`;
    }

    function change() {
      if (state.scenario === 'loading') return heading('Change detail', 'Add Create Change Dashboard flow', '读取 Change Observation。', controls()) + skeleton();
      if (state.scenario === 'empty') return heading('Change detail', 'Add Create Change Dashboard flow', '读取 Change Observation。', controls()) + empty('尚未形成后续事实', 'Ticket Graph、Execution 或 Trace 尚未形成时，页面明确保留其 unavailable 边界。');
      if (state.scenario === 'error') return heading('Change detail', 'Add Create Change Dashboard flow', '读取 Change Observation。', controls()) + error('Observation 暂时不可用', '当前展示不推导新状态。恢复后请重新读取最新权威快照。');
      const stages = ['Intent', 'Understand', 'Design', 'Plan', 'Ticketize', 'Execute', 'Verify', 'FinalVerify'];
      return heading('Change detail', 'Add Create Change Dashboard flow', '当前由 Daemon 形成的 Change Observation；先确认下一步，再展开证据。', `<div class="button-row"><button class="button" data-route="project">Back to Project</button><button class="button" data-refresh>${icons.refresh} Refresh</button></div>`) + `<div class="detail-grid"><div class="main-stack"><section class="panel"><div class="panel-header"><div><h2 class="panel-title">Lifecycle</h2><span class="panel-meta">Base revision · 9d0a12f · observed 2 min ago</span></div>${tag('active · Execute', 'primary')}</div><div class="lifecycle">${stages.map((stage, index) => `<div class="stage ${index < 5 ? 'done' : index === 5 ? 'active' : ''}">${stage}</div>`).join('')}</div><div class="next-step"><span class="next-marker">→</span><span><strong style="color:var(--text)">Next authority action</strong><br />等待 Worker 完成当前 Ticket；仅在 Daemon 返回新的 <code>available_actions</code> 后才显示可处置操作。</span></div></section><section class="panel"><div class="panel-header"><h2 class="panel-title">Canonical Ticket Graph</h2><span class="panel-meta">04 tickets · structural frontier 1</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Ticket</th><th>State</th><th>Dependency</th><th>Verify</th></tr></thead><tbody><tr><td>01</td><td class="main-cell">Create form API client</td><td>${tag('succeeded', 'success')}</td><td>—</td><td>${tag('PASS', 'success')}</td></tr><tr><td>02</td><td class="main-cell">Persist draft interaction</td><td>${tag('running', 'primary')}</td><td>01</td><td>—</td></tr><tr><td>03</td><td class="main-cell">Add form regression coverage</td><td>${tag('blocked', 'default')}</td><td>02</td><td>—</td></tr><tr><td>04</td><td class="main-cell">Review visual states</td><td>${tag('pending', 'default')}</td><td>03</td><td>—</td></tr></tbody></table></div></section><section class="panel"><div class="panel-header"><h2 class="panel-title">Trace</h2><span class="panel-meta">Bounded · latest 4 events</span></div><div class="trace"><div class="trace-row"><span class="trace-time">10:42:18<br />#41</span><span class="trace-dot"></span><div class="trace-copy"><strong>AgentRunCompleted</strong><span>Ticket 01 completed; evidence artifact attached.</span></div></div><div class="trace-row"><span class="trace-time">10:41:03<br />#40</span><span class="trace-dot"></span><div class="trace-copy"><strong>StageAdvanced</strong><span>Execution frontier moved to Ticket 02.</span></div></div><div class="trace-row"><span class="trace-time">10:38:41<br />#39</span><span class="trace-dot"></span><div class="trace-copy"><strong>ExecutionAssigned</strong><span>Worker lease accepted for current workspace.</span></div></div></div></section></div><aside class="rail"><section class="rail-section"><span class="rail-label">Authority</span><div class="rail-value">${tag('active', 'primary')} <span style="margin-left:6px">Execute</span></div><div class="rail-divider"></div><span class="rail-label">Change identity</span><div class="rail-value"><code>chg_01HX7N8VBF</code></div><div class="rail-divider"></div><span class="rail-label">Version</span><div class="rail-value">v12</div></section><section class="rail-section"><span class="rail-label">Available actions</span><div class="stack-buttons"><button class="button primary" data-toast="Pause is available in this prototype">Pause Change</button><button class="button danger" data-toast="Cancel needs confirmation in production">Cancel Change</button></div></section><section class="rail-section"><span class="rail-label">Daemon / Worker</span><div class="rail-value">${tag('ready', 'success')} Daemon</div><div style="margin-top:9px" class="rail-value">${tag('registered', 'success')} Worker · 19s</div></section></aside></div>`;
    }

    function human() {
      if (state.scenario === 'loading') return heading('Governance queue', 'Needs Human', '只显示由 Daemon 明确标记的人工恢复事项。', controls()) + skeleton();
      if (state.scenario === 'empty') return heading('Governance queue', 'Needs Human', '只显示由 Daemon 明确标记的人工恢复事项。', controls()) + empty('当前没有待人工处理的 Change', 'Daemon 没有形成 human_required 事实。');
      if (state.scenario === 'error') return heading('Governance queue', 'Needs Human', '只显示由 Daemon 明确标记的人工恢复事项。', controls()) + error('无法读取人工队列', '请在 Daemon 可用后重试查询。');
      return heading('Governance queue', 'Needs Human', '需要人工核查的权威事实；不由客户端根据超时或心跳推导。', controls()) + `<section class="panel"><div class="panel-header"><h2 class="panel-title">Open review queue</h2><span class="panel-meta">02 items · evidence required</span></div><div class="table-wrap"><table><thead><tr><th>Change</th><th>Reason</th><th>Version</th><th>Required at</th><th></th></tr></thead><tbody><tr><td><span class="main-cell">Capture verification evidence</span><span class="subtext">chg_01HX6V4ADK</span></td><td><span class="main-cell" style="font-size:12px">verification_human_required</span><span class="subtext">Acceptance requires a human verdict.</span></td><td>v07</td><td>28 min ago</td><td><button class="button" data-open-drawer>Review</button></td></tr><tr><td><span class="main-cell">Resolve dirty workspace</span><span class="subtext">chg_01HX4S8CG</span></td><td><span class="main-cell" style="font-size:12px">workspace_conflict</span><span class="subtext">Candidate identity no longer matches.</span></td><td>v04</td><td>Yesterday</td><td><button class="button" data-open-drawer>Review</button></td></tr></tbody></table></div></section>`;
    }

    function create() {
      if (state.scenario === 'loading') return heading('Create Change', 'Start a tracked change', '将原始 Intent 提交给已注册 Project。', '') + skeleton();
      if (state.scenario === 'empty') return heading('Create Change', 'Start a tracked change', '将原始 Intent 提交给已注册 Project。', '') + empty('尚未注册 Project', 'Create Change 只允许选择 Daemon 已注册的 Project。请先在目标仓库运行以下命令。', 'keystone init');
      if (state.scenario === 'error') return heading('Create Change', 'Start a tracked change', '将原始 Intent 提交给已注册 Project。', '') + error('Project 列表暂时不可用', '无法安全选择目标仓库。请恢复 Daemon 后重试。');
      const saved = JSON.parse(sessionStorage.getItem('keystone-prototype-change-draft') || '{}');
      const options = projectOptions.map(([id, path]) => `<option value="${id}" ${saved.project === id ? 'selected' : ''}>${path} · ${id}</option>`).join('');
      return heading('Create Change', 'Start a tracked change', '将需求原文交给已注册 Project 的本机生命周期；创建后立即进入 Change Detail。', `<div class="button-row"><button class="button" data-route="projects">Cancel</button></div>`) + `<div class="form-shell"><form class="panel form-panel" id="create-form"><div class="notice"><span>i</span><span><strong>Authority boundary.</strong> 仅提交 Project、Intent 与 Idempotency-Key；生命周期推进与 Planning 由 Daemon 管理。</span></div><div class="field"><label for="project">Target Project <small>* required</small></label><select id="project" class="select" required><option value="" disabled ${saved.project ? '' : 'selected'}>选择已注册 Project</option>${options}</select><span class="field-help">浏览器不能使用当前目录；请选择 Daemon 已注册的 repository root。</span></div><div class="field"><label for="intent">Intent <small>* required</small></label><textarea id="intent" class="textarea" required placeholder="描述希望 AI 完成的需求">${escapeHTML(saved.intent || '')}</textarea><span class="field-help">原始文字将作为不可变 Intent Artifact 保存，不会在浏览器中改写。</span></div><details class="advanced"><summary>Advanced · Idempotency Key</summary><div class="field"><label for="key">Request key</label><input id="key" class="input" value="${escapeHTML(saved.key || 'ui-01hx7n8vbf-0001')}" /><span class="field-help">自动键用于同一内容的安全重试；手动键由你负责保持。</span></div></details><div class="form-actions"><button type="button" class="button ghost" data-clear-draft>Clear session draft</button><button type="submit" class="button primary">Create Change</button></div></form><aside class="panel form-side"><h2>Before you submit</h2><p>选择的 Project 必须已注册。创建不会修改原始仓库工作区；Daemon 会在固定 revision 上推进后续生命周期。</p><ul><li>可在高级区查看或编辑幂等键</li><li>网络异常后，未更改内容可安全重试</li><li>关闭浏览器会清除本次草稿</li></ul><div class="notice warning"><span>!</span><span>这是高保真原型。提交仅演示跳转，不发送真实 API 请求。</span></div></aside></div>`;
    }

    function render() {
      const content = state.route === 'projects' ? projects() : state.route === 'project' ? project() : state.route === 'change' ? change() : state.route === 'human' ? human() : create();
      appView.innerHTML = content;
      const names = { projects: 'Projects', project: 'Project detail', change: 'Change detail', human: 'Needs Human', create: 'Create Change' };
      crumb.textContent = names[state.route];
      document.querySelectorAll('[data-route]').forEach(button => { button.classList.toggle('active', button.dataset.route === state.route && button.closest('.nav')); });
      bindView();
    }

    function bindView() {
      document.querySelectorAll('[data-route]').forEach(button => button.addEventListener('click', () => { state.route = button.dataset.route; state.scenario = 'default'; document.querySelector('#scenario').value = 'default'; render(); }));
      document.querySelectorAll('[data-open="project"]').forEach(button => button.addEventListener('click', () => { state.route = 'project'; render(); }));
      document.querySelectorAll('[data-open="change"]').forEach(button => button.addEventListener('click', () => { state.route = 'change'; render(); }));
      document.querySelectorAll('[data-refresh]').forEach(button => button.addEventListener('click', () => { state.scenario = 'loading'; render(); setTimeout(() => { state.scenario = 'default'; render(); }, 520); }));
      document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', () => { navigator.clipboard?.writeText(button.dataset.copy); const label = button.querySelector('span'); label.textContent = 'Copied'; setTimeout(() => label.textContent = 'Copy', 1000); }));
      document.querySelectorAll('[data-open-drawer]').forEach(button => button.addEventListener('click', () => { const drawer = document.querySelector('#drawer'); drawer.classList.add('visible'); drawer.setAttribute('aria-hidden', 'false'); }));
      document.querySelectorAll('[data-toast]').forEach(button => button.addEventListener('click', () => { button.textContent = button.dataset.toast; setTimeout(() => { button.textContent = button.classList.contains('danger') ? 'Cancel Change' : 'Pause Change'; }, 1400); }));
      const form = document.querySelector('#create-form');
      if (form) {
        const saveDraft = () => { const project = document.querySelector('#project').value; const intent = document.querySelector('#intent').value; const key = document.querySelector('#key').value; sessionStorage.setItem('keystone-prototype-change-draft', JSON.stringify({ project, intent, key })); };
        form.querySelectorAll('select, textarea, input').forEach(field => field.addEventListener('input', saveDraft));
        form.addEventListener('submit', event => { event.preventDefault(); const project = document.querySelector('#project'); const intent = document.querySelector('#intent'); if (!project.value || !intent.value.trim()) { form.reportValidity(); return; } saveDraft(); state.route = 'change'; render(); });
        document.querySelector('[data-clear-draft]').addEventListener('click', () => { sessionStorage.removeItem('keystone-prototype-change-draft'); render(); });
      }
    }

    document.querySelector('#scenario').addEventListener('change', event => { state.scenario = event.target.value; render(); });
    document.querySelectorAll('[data-close-drawer]').forEach(button => button.addEventListener('click', () => { const drawer = document.querySelector('#drawer'); drawer.classList.remove('visible'); drawer.setAttribute('aria-hidden', 'true'); }));
    render();
  </script>
</body>
</html>
